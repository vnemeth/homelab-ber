services:
  fmradio:
    # Built from the Dockerfile here: rtl_fm and lame (FM) or welle-cli (DAB+) receive
    # with the dongle, fmradio.py serves MP3 at http://127.0.0.1:8099/<MHz> and
    # /<DAB+ block>?name=<station>
    build: .
    image: fmradio:local
    restart: unless-stopped
    # Only Music Assistant (host network) plays the stream, so it stays on localhost
    ports:
      - 127.0.0.1:8099:8099
    volumes:
      # The dongle; mounted rather than passed as a device, so it still works after
      # it's been unplugged and gets a new device node
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # USB devices
      - c 189:* rmw
    environment:
      # Frequency correction of the dongle in ppm; measured at 15–40, too little to matter
      # for FM
      PPM: 0
      # FM tuner gain in dB (empty: auto). Auto overloads on Berlin's strong
      # transmitters and sounds off-station; 20 sounded cleanest. DAB+ uses auto gain
      GAIN: 20
