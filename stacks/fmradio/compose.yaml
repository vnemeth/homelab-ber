services:
  fmradio:
    # Built from the Dockerfile here: rtl_fm tunes the dongle, ffmpeg encodes MP3,
    # fmradio.py serves it at http://127.0.0.1:8099/<MHz>
    build: .
    image: fmradio:local
    restart: unless-stopped
    # Only Music Assistant (host network) plays the stream, so it stays on localhost
    ports:
      - 127.0.0.1:8099:8099
    volumes:
      # The dongle; mounted rather than passed as a device, so it still works after
      # it's been unplugged and gets a new device node
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # USB devices
      - c 189:* rmw
    environment:
      # Frequency correction of the dongle in ppm; measured at 15–40, too little to matter
      # for FM
      PPM: 0
      # Tuner gain in dB (empty: auto). Auto overloads on Berlin's strong transmitters
      # and sounds off-station; 20 sounded cleanest
      GAIN: 20
