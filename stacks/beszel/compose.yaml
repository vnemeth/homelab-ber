services:
  beszel:
    image: henrygd/beszel:0.21
    restart: unless-stopped
    # The agent reaches the hub here; also a fallback via SSH tunnel:
    #   ssh -L 8090:localhost:8090 valentin@192.168.2.30
    ports:
      - 127.0.0.1:8090:8090
    environment:
      APP_URL: https://beszel.local.ber.nvcode.com
      # Create Beszel users automatically on their first authentik (OIDC) login
      USER_CREATION: "true"
      # Only authentik (OIDC) logins. On a fresh setup, set to "false" until the first user
      # exists and the OIDC login works
      DISABLE_PASSWORD_AUTH: "true"
    volumes:
      - /srv/beszel/data:/beszel_data
      - /srv/beszel/socket:/beszel_socket
    networks:
      - proxy
    labels:
      # Login is handled by Beszel's own OIDC integration with authentik, not forward auth
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`beszel.local.ber.nvcode.com`)
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.services.beszel.loadbalancer.server.port=8090

  beszel-agent:
    image: henrygd/beszel-agent:0.21
    restart: unless-stopped
    # Host networking, so the agent reports the host's network traffic
    network_mode: host
    volumes:
      - /srv/beszel/agent:/var/lib/beszel-agent
      - /srv/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Disk usage of the root, data and Docker volumes. The container sees no part of
      # the root filesystem otherwise, and took the Docker volume (behind its
      # /etc/hosts) for root, hiding the Docker one; FILESYSTEM below names root
      - /.beszel:/extra-filesystems/root:ro
      # <device>__<name>: Beszel shows the name after "__" instead of dm-1, dm-2
      - /data/.beszel:/extra-filesystems/vg0-data__data:ro
      - /var/lib/docker/.beszel:/extra-filesystems/vg0-docker__docker:ro
    environment:
      FILESYSTEM: /extra-filesystems/root
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${TOKEN}
      KEY: ${KEY}

networks:
  proxy:
    external: true
