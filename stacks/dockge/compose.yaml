services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    # Fallback if Traefik or authentik is down, reachable only via an SSH tunnel:
    #   ssh -L 5001:localhost:5001 valentin@192.168.2.30
    ports:
      - 127.0.0.1:5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/dockge/data:/app/data
      # The stacks path must be the same inside the container as on the host
      - /opt/homelab-ber/stacks:/opt/homelab-ber/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/homelab-ber/stacks
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge.rule=Host(`dockge.local.ber.nvcode.com`)
      - traefik.http.routers.dockge.entrypoints=websecure
      - traefik.http.routers.dockge.middlewares=authentik@docker
      - traefik.http.services.dockge.loadbalancer.server.port=5001

networks:
  proxy:
    external: true
