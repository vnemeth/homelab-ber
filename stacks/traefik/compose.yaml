services:
  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      # Redirect all HTTP to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Every router on websecure uses the wildcard certificate
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=local.ber.nvcode.com
      - --entrypoints.websecure.http.tls.domains[0].sans=*.local.ber.nvcode.com
      - --certificatesresolvers.letsencrypt.acme.email=valentin@nvcode.com
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=dreamhost
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - 80:80
      - 443:443
    environment:
      - DREAMHOST_API_KEY=${DREAMHOST_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/traefik/acme:/acme
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.local.ber.nvcode.com`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}

networks:
  proxy:
    external: true
