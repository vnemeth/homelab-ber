# Waveshare ESP32-S3-AUDIO-Board as a Home Assistant voice satellite: "Okay Nabu"
# wake word on the board, speech handled by Home Assistant's Assist pipeline.
# Based on https://github.com/jensenbox/waveshare-esp32-s3-audio (MIT), without its
# alarm clock. The LCD isn't used.
#
# Flashed from the server, see README step 25. Secrets come from secrets.yaml next
# to this file (git-ignored; template in secrets.yaml.example).

esphome:
  name: voice-satellite
  friendly_name: Voice satellite

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Uses the API encryption key
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Hotspot to set Wi-Fi from a phone if it can't connect
  ap:
    ssid: "Voice satellite fallback"
    password: !secret fallback_ap_password

captive_portal:

# --- Hardware ---

# Shared by the ES8311, ES7210, TCA9555 and PCF85063
i2c:
  scl: GPIO10
  sda: GPIO11

i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO12
    i2s_bclk_pin: GPIO13
    i2s_lrclk_pin: GPIO14

# ES7210: the microphones
audio_adc:
  - platform: es7210
    id: es7210_adc

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO15
    adc_type: external

# ES8311: the speaker
audio_dac:
  - platform: es8311
    id: es8311_dac

speaker:
  - platform: i2s_audio
    id: spkr
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO16
    dac_type: external
    audio_dac: es8311_dac
    buffer_duration:
      seconds: 20

# I/O expander: speaker amplifier and the three keys
tca9555:
  - id: exio
    address: 0x20

switch:
  - platform: gpio
    id: pa_enable
    name: "Speaker amplifier"
    pin:
      tca9555: exio
      number: 8
      mode: OUTPUT
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    name: "Key 1 (volume down)"
    pin:
      tca9555: exio
      number: 9
      mode: INPUT
      inverted: true
    on_press:
      - media_player.volume_down: player
  - platform: gpio
    name: "Key 2 (assist)"
    pin:
      tca9555: exio
      number: 10
      mode: INPUT
      inverted: true
    on_press:
      - voice_assistant.start:
  - platform: gpio
    name: "Key 3 (volume up)"
    pin:
      tca9555: exio
      number: 11
      mode: INPUT
      inverted: true
    on_press:
      - media_player.volume_up: player

# Plays the replies and Home Assistant's announcements. Going through the media player
# (not the speaker directly) makes the board report announcement support, and only
# then does Home Assistant ask it for its wake words: otherwise its Wake word select
# stays unavailable
media_player:
  - platform: speaker
    id: player
    name: "Media player"
    announcement_pipeline:
      speaker: spkr
    on_announcement:
      - micro_wake_word.stop:
      - delay: 500ms
      - wait_until:
          not:
            media_player.is_announcing:
      - delay: 500ms
      - lambda: id(va).set_use_wake_word(false);
      - micro_wake_word.start:

# How sure the wake word model must be (probability cutoff, out of 255). The model's
# own 0.97 often missed "Okay Nabu" over the radio; lower wakes up more readily, and
# more often by mistake
select:
  - platform: template
    name: "Wake word sensitivity"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Default
      - Moderately sensitive
      - Very sensitive
    initial_option: Moderately sensitive
    on_value:
      - lambda: |-
          if (x == "Default") {
            id(okay_nabu).set_probability_cutoff(247);  // 0.97
          } else if (x == "Moderately sensitive") {
            id(okay_nabu).set_probability_cutoff(217);  // 0.85
          } else {
            id(okay_nabu).set_probability_cutoff(176);  // 0.69
          }

# 7 LEDs: show what the assistant is doing
light:
  - platform: esp32_rmt_led_strip
    id: rgb_ring
    name: "LED ring"
    pin: GPIO38
    num_leds: 7
    chipset: ws2812
    channel_colors: RGB
    effects:
      - addressable_scan:
          name: Scanner
          move_interval: 60ms

script:
  # Restarts the wake word after a command with no spoken reply, where the media
  # player's on_announcement never runs
  - id: restart_mww_fallback
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            not:
              micro_wake_word.is_running:
          then:
            - wait_until:
                not:
                  speaker.is_playing:
            - delay: 500ms
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:

micro_wake_word:
  id: mww
  microphone: mic
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json
  models:
    - model: okay_nabu
      id: okay_nabu
  on_wake_word_detected:
    # A fallback still pending from the last request could restart the wake word
    # mid-request, which takes the shared I2S bus
    - script.stop: restart_mww_fallback
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  media_player: player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  volume_multiplier: 2.0
  on_client_connected:
    - delay: 2s
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
  # Listening: green
  on_listening:
    - light.turn_on:
        id: rgb_ring
        brightness: 35%
        red: 0%
        green: 100%
        blue: 0%
        effect: Scanner
  # Thinking: yellow
  on_intent_start:
    - light.turn_on:
        id: rgb_ring
        brightness: 35%
        red: 100%
        green: 90%
        blue: 0%
        effect: Scanner
  # Replying: blue. The media player's on_announcement restarts the wake word after
  # the reply
  on_tts_start:
    - light.turn_on:
        id: rgb_ring
        brightness: 35%
        red: 0%
        green: 30%
        blue: 100%
        effect: none
  on_end:
    - light.turn_off: rgb_ring
    - script.execute: restart_mww_fallback
  # Error: red for a moment
  on_error:
    - light.turn_on:
        id: rgb_ring
        brightness: 60%
        red: 100%
        green: 0%
        blue: 0%
        effect: none
    - delay: 1s
    - light.turn_off: rgb_ring
    - wait_until:
        not:
          speaker.is_playing:
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
